name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 mypy pytest pytest-cov

      - name: Lint — black (format check)
        run: black --check --line-length=120 src/ webapp/backend/ tests/

      - name: Lint — flake8
        run: flake8 src/ webapp/backend/ tests/ --max-line-length=120 --ignore=E501,W503

      - name: Type check — mypy
        run: mypy src/ --ignore-missing-imports || true

      - name: Security scan — bandit
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ || true

      - name: Dependency vulnerability check
        run: |
          pip install safety
          safety check || true

      - name: Run tests with coverage
        env:
          OPENROUTER_API_KEY: ''
          GEMINI_API_KEY: ''
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webapp/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx oxlint src/

      - name: Type-check & Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: scdo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scdo:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
