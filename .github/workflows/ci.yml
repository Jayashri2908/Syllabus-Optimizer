name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # Backend: lint + test
  # --------------------------------------------------------------------------
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint — black (format check)
        run: black --check src/ webapp/backend/ tests/

      - name: Lint — flake8
        run: flake8 src/ webapp/backend/ tests/ --max-line-length=120 --ignore=E501,W503

      - name: Run tests
        env:
          OPENROUTER_API_KEY: ''
          GEMINI_API_KEY: ''
        run: pytest tests/ -v --tb=short

  # --------------------------------------------------------------------------
  # Frontend: lint + build
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webapp/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx oxlint src/

      - name: Type-check & Build
        run: npm run build
