<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Text Curtain Prototype</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e9e1d3; /* The textured beige color */
            font-family: 'Times New Roman', serif;
        }

        #canvas {
            display: block;
        }

        /* Styling to mimic the static UI in the video */
        .ui-element {
            position: absolute;
            color: #333;
        }

        .title {
            top: 40%;
            left: 10%;
            font-size: 40px;
            max-width: 200px;
            line-height: 1.1;
        }
        
        .title span {
            font-size: 16px;
            display: block;
            margin-bottom: 20px;
            color: #777;
        }

        .roof {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 100px;
            background: linear-gradient(to bottom, #d32f2f, #b71c1c); /* Red roof color */
            border-radius: 10px 10px 0 0;
            border-bottom: 10px solid #222;
            z-index: 10;
            box-shadow: 0 20px 30px rgba(0,0,0,0.2);
        }
        
        .roof::before {
            content: '';
            position: absolute;
            top: -20px; left: -20px; right: -20px; height: 30px;
            background: #222;
            border-radius: 50% 50% 0 0;
        }
    </style>
</head>
<body>

    <!-- Static UI Elements -->
    <div class="roof"></div>
    <div class="ui-element title">
        <span>Japan — red eaves in the mist</span>
        architecture, paths, and patience.
    </div>

    <!-- The Canvas where the magic happens -->
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        // Mouse tracking
        const mouse = { x: -1000, y: -1000, radius: 80 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        
        // When mouse leaves screen, move it far away so text settles
        window.addEventListener('mouseout', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        // The physics object for each individual letter
        class Particle {
            constructor(x, y, character) {
                this.x = x;
                this.y = y;
                this.baseX = x; // The original X resting position
                this.baseY = y; // The original Y resting position
                this.vx = 0;    // Velocity X
                this.vy = 0;    // Velocity Y
                this.character = character;
                
                // Physics properties
                this.friction = 0.85; // How fast it slows down
                this.spring = 0.05;   // How hard it snaps back to original position
            }

            update() {
                // 1. Calculate distance from mouse
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                // 2. Mouse Repulsion Force
                if (distance < mouse.radius) {
                    // Calculate how much force to apply (closer = stronger)
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let force = (mouse.radius - distance) / mouse.radius;
                    
                    let directionX = forceDirectionX * force * -5; 
                    let directionY = forceDirectionY * force * -5;

                    // Apply force to velocity
                    this.vx += directionX;
                    this.vy += directionY;
                }

                // 3. Spring back to base position (Gravity/Tension)
                let baseDx = this.baseX - this.x;
                let baseDy = this.baseY - this.y;
                
                this.vx += baseDx * this.spring;
                this.vy += baseDy * this.spring;

                // 4. Apply friction and update position
                this.vx *= this.friction;
                this.vy *= this.friction;
                
                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.fillText(this.character, this.x, this.y);
            }
        }

        // Create the grid of text
        function initParticles() {
            particles = [];
            
            // Sample characters to use (Japanese Kanji/Kana mix)
            const chars = "天地玄黄宇宙洪荒日月盈昃辰宿列張寒来暑往秋収冬蔵閏余成歳律呂調陽雲騰致雨露結為霜金生麗水玉出崑岡剣号巨闕珠称夜光果珍李奈菜重芥姜海鹹河淡鱗潜羽翔龍師火帝鳥官人皇始制文字乃服衣裳".split("");
            
            // Layout configurations
            const cols = 22;
            const rows = 30;
            const spacingX = 16;
            const spacingY = 16;
            
            // Center the grid under the "roof"
            const startX = (width / 2) - ((cols * spacingX) / 2) + 8;
            const startY = height * 0.15 + 80; // Start below the roof

            let charIndex = 0;

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    let x = startX + (i * spacingX);
                    let y = startY + (j * spacingY);
                    
                    let char = chars[charIndex % chars.length];
                    particles.push(new Particle(x, y, char));
                    
                    charIndex++;
                }
            }
        }

        // The main animation loop
        function animate() {
            // Clear the canvas every frame
            ctx.clearRect(0, 0, width, height);
            
            // Set text style
            ctx.fillStyle = '#5c5446'; // Dark grayish brown
            ctx.font = '12px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Update and draw every single letter
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        
        // Start the app
        resize();
        animate();

    </script>
</body>
</html>
