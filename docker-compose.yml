# =============================================================================
# SCDO — Docker Compose (Development + Production)
# =============================================================================
# Usage:
#   docker compose up          — start backend (serves built frontend too)
#   docker compose build       — rebuild image
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8000
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Development-only: live frontend with hot reload
  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./webapp/frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    profiles:
      - dev
    depends_on:
      - backend
