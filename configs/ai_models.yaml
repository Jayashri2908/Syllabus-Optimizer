# AI Models Configuration - OpenRouter (PRIMARY) + Gemini (FALLBACK)

# OpenRouter - Nvidia Nemotron (PRIMARY - FREE)
openrouter:
  enabled: true
  model: 'nvidia/nemotron-3-nano-30b-a3b:free'
  # Set OPENROUTER_API_KEY environment variable
  # Get free key: https://openrouter.ai

# Google Gemini (FALLBACK - FREE)
gemini:
  enabled: false  # Enable when OPENROUTER_API_KEY is not set
  model: 'gemini-2.0-flash-exp'
  # Set GEMINI_API_KEY environment variable

# Task preferences - OpenRouter first, Gemini fallback
task_preferences:
  generation: ['openrouter', 'gemini']
  analysis: ['openrouter', 'gemini']
  optimization: ['openrouter', 'gemini']
  validation: ['openrouter', 'gemini']

# Advanced settings
advanced:
  auto_fallback: true  # Auto-switch to Gemini if OpenRouter fails
  enable_caching: true
  cache_duration_hours: 24
  
  # Temperature by task type
  temperature_overrides:
    learning_outcomes: 0.4    # More focused for outcomes
    unit_generation: 0.6      # Balanced creativity
    overview: 0.65            # Slightly creative for overviews
    gap_analysis: 0.3         # Factual analysis
    suggestions: 0.5          # Balanced recommendations
