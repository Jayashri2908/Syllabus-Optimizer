# NEP 2020 (National Education Policy 2020) Guidelines
# For validating syllabus alignment with NEP 2020 requirements

nep_2020_guidelines:
  # Multidisciplinary and Holistic Education
  multidisciplinary:
    min_percentage: 10  # Minimum 10% interdisciplinary/multidisciplinary content
    description: "Courses should include interdisciplinary knowledge and connections"
    
  # Skill Development Focus
  skill_development:
    required_skills:
      - "critical_thinking"
      - "communication"
      - "problem_solving"
      - "collaboration"
      - "digital_literacy"
      - "creativity"
      - "ethical_reasoning"
    min_skill_outcomes: 2  # At least 2 skill-based outcomes
    
  # Experiential Learning
  experiential_learning:
    required_components:
      - "projects"
      - "internships"
      - "field_visits"
      - "simulations"
      - "hands_on_activities"
    min_components: 1  # At least 1 experiential component
    
  #Assessment Pattern (Continuous + Summative)
  assessment_pattern:
    formative_min: 30  # Minimum 30% continuous assessment
    formative_max: 50  # Maximum 50% continuous assessment
    summative_min: 50  # Minimum 50% end-term
    summative_max: 70  # Maximum 70% end-term
    diversity_required: true  # Multiple assessment methods
    
  # Flexibility and Choice
  flexibility:
    electives_encouraged: true
    choice_based_credits: true
    inter_disciplinary_options: true
    
  # Research and Innovation
  research_innovation:
    project_based_learning: true
    research_methodology: "recommended"
    innovation_focus: true
    
  # Technology Integration
  technology:
    ict_integration: "mandatory"
    online_resources: "encouraged"
    digital_tools: "recommended"
    
  # Outcome-Based Education (OBE)
  obe_requirements:
    clear_learning_outcomes: true
    measurable_outcomes: true
    co_po_mapping: "mandatory"
    outcome_attainment: "required"
    
  # Values and Ethics
  values_ethics:
    ethical_component: "encouraged"
    social_responsibility: "recommended"
    environmental_awareness: "recommended"

# Compliance Scoring
compliance_scoring:
  excellent: 90  # >= 90%
  good: 75       # >= 75%
  satisfactory: 60  # >= 60%
  needs_improvement: 0  # < 60%
