# Verified Reference Books for SCDO
# Only well-known, widely-adopted textbooks with confirmed existence
# Used to guide LLM reference generation and reduce hallucination

machine_learning:
  textbooks:
    - "Pattern Recognition and Machine Learning by Christopher Bishop (Springer, 2006)"
    - "Deep Learning by Ian Goodfellow, Yoshua Bengio, Aaron Courville (MIT Press, 2016)"
    - "Hands-On Machine Learning with Scikit-Learn, Keras, and TensorFlow by Aurelien Geron (O'Reilly, 3rd Edition, 2022)"
    - "An Introduction to Statistical Learning by Gareth James et al. (Springer, 2nd Edition, 2021)"
    - "Machine Learning: A Probabilistic Perspective by Kevin Murphy (MIT Press, 2012)"
  online_resources:
    - "Machine Learning Specialization by Andrew Ng on Coursera (Stanford)"
    - "Deep Learning Specialization by Andrew Ng on Coursera (deeplearning.ai)"
    - "Fast.ai Practical Deep Learning for Coders (free online course)"

